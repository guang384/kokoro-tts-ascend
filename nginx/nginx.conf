worker_processes auto;
events {
    worker_connections 1024;
}
http {
    upstream kokoro_api {
        least_conn;
        # docker compose DNS：--scale api=N 后 restart nginx 即可发现全部实例
        server api:5174 max_fails=3 fail_timeout=10s;
        # 刻意不开 upstream keepalive：每请求新建连接，让 least_conn 按"在途请求数"
        # 重新均衡，避免长连接钉死单个 uvicorn worker 导致攒批倾斜；
        # 建连成本（内网 ~0.5ms）相对 TTS 耗时可忽略
    }

    server {
        listen 8000;
        # 入口体积上限：须 ≥ 网关 MAX_BODY_BYTES（默认 4MB）——nginx 先卡 4-10MB
        # 区间的请求再被网关 413 没有意义；调大 MAX_BODY_BYTES 时同步抬这里
        client_max_body_size 10m;

        location / {
            proxy_pass http://kokoro_api;
            # 读超时须 ≥ 网关 WAIT_TIMEOUT_S（默认 120s）×2：/tts 音频+对齐
            # 共享单一预算，网关最迟 120s 应答，300s 留足余量
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_set_header X-Real-IP $remote_addr;
            # 保持 nginx 默认 HTTP/1.0（无 keepalive），与 upstream 注释的意图一致
        }
    }
}
