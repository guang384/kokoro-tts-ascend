apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-tts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kokoro-tts
  template:
    metadata:
      labels:
        app: kokoro-tts
    spec:
      containers:
      - name: kokoro
        image: harbor:5000/kokoro-tts-ascend:20261116-r7
        resources:
          requests:
            cpu: "32"
            memory: "64Gi"
            huawei.com/Ascend910B3: "1"
            huawei.com/Ascend910B3-memory: "64000"
          limits:
            cpu: "32"
            memory: "64Gi"
            huawei.com/Ascend910B3: "1"
            huawei.com/Ascend910B3-memory: "64000"
        volumeMounts:
        - mountPath: /etc/ascend_install.info
          name: ascendinstallinfo
          readOnly: true
        - mountPath: /usr/local/Ascend/driver
          name: driver
          readOnly: true
        - mountPath: /etc/ld.so.conf.d/ascend_driver_so.conf
          name: ascenddriversoconf
          readOnly: true
        - mountPath: /usr/local/sbin
          name: sbin
          readOnly: true
        - mountPath: /dev/shm
          name: shm
        startupProbe:              # 串行启动 + NPU 预热宽限 15 分钟
          httpGet: {path: /health, port: 5174}
          failureThreshold: 90
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet: {path: /health, port: 5174}
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:             # 长故障才重启（覆盖 worker 重生 1-2 分钟瞬态）
          httpGet: {path: /health, port: 5174}
          failureThreshold: 36
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - hostPath:
          path: /etc/ascend_install.info
          type: File
        name: ascendinstallinfo
      - hostPath:
          path: /usr/local/Ascend/driver
          type: Directory
        name: driver
      - hostPath:
          path: /etc/ld.so.conf.d/ascend_driver_so.conf
          type: File
        name: ascenddriversoconf
      - hostPath:
          path: /usr/local/sbin
          type: Directory
        name: sbin
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: shm
---
apiVersion: v1
kind: Service
metadata:
  name: kokoro-tts
spec:
  selector: {app: kokoro-tts}
  ports:
    - port: 5174
      targetPort: 5174